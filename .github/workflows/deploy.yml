name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.4.2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify successful deployment
        if: ${{ success() }}
        continue-on-error: true
        env:
          NTFY_URL: "https://ntfy.tunnel.qrivi.dev/website"
          NTFY_USERNAME: "qrivi"
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          : "${NTFY_PASSWORD:?Set the NTFY_PASSWORD repository secret}"

          curl --fail --silent --show-error --output /dev/null \
            --proto '=https' \
            --connect-timeout 10 --max-time 30 \
            --user "$NTFY_USERNAME:$NTFY_PASSWORD" \
            --header "Title: Deployment successful" \
            --header "Tags: white_check_mark" \
            --header "Click: $DEPLOYMENT_URL" \
            --data-binary "Deployed $GITHUB_REPOSITORY (${GITHUB_SHA:0:7}) to $DEPLOYMENT_URL" \
            --url "$NTFY_URL"
